name: Test with EDM

on: [pull_request, workflow_dispatch]

env:
  INSTALL_EDM_VERSION: 4.1.7
  # No macOS build of EDM 4.1.7 exists (EDM is supported on Linux and Windows); macOS keeps the last version that has one.
  INSTALL_EDM_VERSION_MACOS: 3.3.1

jobs:

  test-with-edm:

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Set up EDM
        uses: enthought/setup-edm-action@v4.2
        with:
          edm-version: ${{ runner.os == 'macOS' && env.INSTALL_EDM_VERSION_MACOS || env.INSTALL_EDM_VERSION }}

      - name: Check out the repository
        uses: actions/checkout@v2

      - name: Install click to the default EDM environment
        run: edm install -y click wheel

      - name: Install codetools
        run: edm run -- python etstool.py install

      - name: Run tests
        run: edm run -- python etstool.py test
